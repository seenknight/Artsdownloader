<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دانلود تصاویر Google Arts &amp; Culture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<link rel="shortcut icon" href="/favicon.ico">
<style>
  :root { --wall:#e6e9ec; --ink:#1f2437; --muted:#5d6475; --accent:#1f3fbf; --on-accent:#fff; --mat:#fff; --line:#cdd2da; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --wall:#14171f; --ink:#e7e9ef; --muted:#9aa1b2; --accent:#9db1ff; --on-accent:#10142a; --mat:#1d212c; --line:#2d3342; --err:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--wall); color:var(--ink); font-family:Vazirmatn, Tahoma, "Segoe UI", sans-serif; line-height:1.8; }
  .wrap { max-width:1000px; margin:0 auto; padding:48px 18px 72px; }
  .wrap img {heigh:150px;}
  h1 { font-size:clamp(1.7rem, 5vw, 2rem); font-weight:800; line-height:1.3; margin:0 0 10px; }
  .sub { color:var(--muted); margin:0 0 28px; max-width:60ch; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  input[type=text] { flex:1 1 320px; padding:13px 14px; border:1px solid var(--line); border-radius:6px; background:var(--mat);
    color:var(--ink); font:inherit; direction:ltr; text-align:left; }
  button { padding:13px 24px; border:1px solid var(--accent); border-radius:6px; background:var(--accent); color:var(--on-accent);
    font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  button:disabled { opacity:.55; cursor:default; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  label.chk { display:flex; align-items:center; gap:8px; margin-top:14px; color:var(--muted); font-size:.95rem; }
  #status { margin-top:14px; min-height:1.8em; color:var(--muted); }
  #status.err { color:var(--err); }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:36px 0 16px; padding-top:14px; border-top:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:22px; }
  .frame { background:var(--mat); border:1px solid var(--line); padding:12px; display:flex; flex-direction:column; gap:10px; }
  .thumb { aspect-ratio:4/3; background:var(--wall); display:flex; align-items:center; justify-content:center; }
  .thumb img { max-width:100%; max-height:100%; object-fit:contain; }
  .name { font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  a.dl { color:var(--accent); font-size:.9rem; font-weight:600; text-decoration:none; border-top:1px solid var(--line); padding-top:8px; }
  a.dl:hover { text-decoration:underline; }
  .note { margin-top:40px; font-size:.82rem; color:var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <img src="/logo.png" />
  <h1>تصاویر Google Arts &amp; Culture را با بالاترین کیفیت بگیرید</h1>
  <p class="sub">لینک صفحه‌ی یک اثر یا یک مجموعه را وارد کنید تا تصاویر آن با اندازه‌ی اصلی آماده‌ی دانلود شوند.</p>

  <div class="row">
    <input id="url" type="text" inputmode="url" aria-label="لینک صفحه" placeholder="https://artsandculture.google.com/asset/..." autofocus>
    <button id="go">دریافت تصاویر</button>
  </div>
  <label class="chk"><input id="all" type="checkbox"> همه‌ی تصاویر صفحه (برای صفحه‌ی مجموعه یا داستان)</label>
  <div id="status" role="status" aria-live="polite"></div>

  <section id="results" hidden>
    <div class="bar">
      <strong id="count"></strong>
      <button id="dlall" class="ghost">دانلود همه</button>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <p class="note">لطفاً کپی‌رایت و شرایط استفاده‌ی هر اثر را رعایت کنید.</p>
</main>

<script>
const $ = id => document.getElementById(id);
let current = [];

function setStatus(msg, err) { const s = $('status'); s.textContent = msg; s.className = err ? 'err' : ''; }

async function go() {
  const url = $('url').value.trim().replace(/^["']|["']$/g, '');
  if (!url) { setStatus('ابتدا لینک را وارد کنید.', true); return; }
  $('go').disabled = true;
  $('results').hidden = true;
  setStatus('در حال دریافت اطلاعات صفحه...');
  try {
    const r = await fetch('/api/fetch', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ url, all: $('all').checked }) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    render(j);
    setStatus('');
  } catch (e) {
    setStatus('خطا: ' + e.message, true);
  } finally {
    $('go').disabled = false;
  }
}

function render(j) {
  const grid = $('grid');
  grid.innerHTML = '';
  current = [];
  j.images.forEach((base, i) => {
    const name = j.images.length > 1 ? `${j.title} ${i + 1}` : j.title;
    const href = `/api/download?u=${encodeURIComponent(base)}&n=${encodeURIComponent(name)}`;
    current.push(href);
    const el = document.createElement('figure');
    el.className = 'frame';
    el.style.margin = '0';
    el.innerHTML = `<div class="thumb"><img loading="lazy" referrerpolicy="no-referrer" alt="" src="${base}=s480"></div>
      <figcaption class="name"></figcaption><a class="dl" href="${href}">دانلود با اندازه‌ی اصلی</a>`;
    el.querySelector('.name').textContent = name;
    grid.appendChild(el);
  });
  $('count').textContent = `${j.images.length} تصویر پیدا شد`;
  $('dlall').hidden = j.images.length < 2;
  $('results').hidden = false;
}

async function downloadAll() {
  for (const href of current) {
    const a = document.createElement('a');
    a.href = href; a.download = ''; document.body.appendChild(a); a.click(); a.remove();
    await new Promise(r => setTimeout(r, 900));
  }
}

$('go').addEventListener('click', go);
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
$('dlall').addEventListener('click', downloadAll);
</script>
</body>
</html>
